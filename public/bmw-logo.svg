<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <circle cx="250" cy="250" r="230" fill="#000000" stroke="#f3f4f6" stroke-width="12"/>
  <circle cx="250" cy="250" r="135" fill="none" stroke="#ffffff" stroke-width="10"/>
  <g clip-path="url(#clip)">
    <defs>
      <clipPath id="clip">
        <circle cx="250" cy="250" r="130"/>
      </clipPath>
    </defs>
    <rect x="120" y="120" width="130" height="130" fill="#ffffff"/>
    <rect x="250" y="120" width="130" height="130" fill="#1d8bfd"/>
    <rect x="120" y="250" width="130" height="130" fill="#1d8bfd"/>
    <rect x="250" y="250" width="130" height="130" fill="#ffffff"/>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="64" text-anchor="middle">
    <text x="145" y="150" transform="rotate(-40 145 150)">B</text>
    <text x="250" y="90">M</text>
    <text x="355" y="150" transform="rotate(40 355 150)">W</text>
  </g>
</svg>
