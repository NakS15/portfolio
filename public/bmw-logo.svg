<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="bmw-quadrant">
      <circle cx="250" cy="250" r="130" />
    </clipPath>
  </defs>
  <circle cx="250" cy="250" r="230" fill="#000000" stroke="#a3a3a3" stroke-width="10" />
  <circle cx="250" cy="250" r="135" fill="none" stroke="#ffffff" stroke-width="6" />
  <g clip-path="url(#bmw-quadrant)">
    <rect x="120" y="120" width="130" height="130" fill="#ffffff" />
    <rect x="250" y="120" width="130" height="130" fill="#0066b1" />
    <rect x="120" y="250" width="130" height="130" fill="#0066b1" />
    <rect x="250" y="250" width="130" height="130" fill="#ffffff" />
  </g>
  <g fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="64" text-anchor="middle">
    <text x="145" y="150" transform="rotate(-40 145 150)">B</text>
    <text x="250" y="90">M</text>
    <text x="355" y="150" transform="rotate(40 355 150)">W</text>
  </g>
